<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Car Price Predictor</title>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">

    <!-- Pass Flask data to JS safely -->
    <script>
        var companies = {{ companies | tojson }};
        var car_models = {{ car_models | tojson }};
    </script>
</head>

<body class="bg-dark">

<div class="container">
    <div class="row">
        <div class="card mt-50 w-100">
            <div class="card-header text-center">
                <h1>Welcome to Car Price Predictor</h1>
            </div>

            <div class="card-body">

                <div class="text-center">
                    <h5>
                        This app predicts the price of a car you want to sell.
                        Try filling the details below:
                    </h5>
                </div>

                <br>

                <form id="predictionForm">

                    <!-- Company -->
                    <div class="form-group text-center">
                        <label><b>Select the company:</b></label>
                        <select class="form-control"
                                id="company"
                                name="company"
                                onchange="load_car_models()"
                                required>
                            {% for company in companies %}
                            <option value="{{ company }}">{{ company }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Model -->
                    <div class="form-group text-center">
                        <label><b>Select the model:</b></label>
                        <select class="form-control"
                                id="car_models"
                                name="car_models"
                                required>
                        </select>
                    </div>

                    <!-- Year -->
                    <div class="form-group text-center">
                        <label><b>Select Year of Purchase:</b></label>
                        <select class="form-control"
                                name="year"
                                required>
                            {% for year in years %}
                            <option value="{{ year }}">{{ year }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Fuel Type -->
                    <div class="form-group text-center">
                        <label><b>Select the Fuel Type:</b></label>
                        <select class="form-control"
                                name="fuel_type"
                                required>
                            {% for fuel in fuel_types %}
                            <option value="{{ fuel }}">{{ fuel }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Kilometers -->
                    <div class="form-group text-center">
                        <label><b>Enter Kilometres Driven:</b></label>
                        <input type="number"
                               class="form-control"
                               name="kilo_driven"
                               placeholder="Enter kilometres driven"
                               required>
                    </div>

                    <!-- Predict Button -->
                    <div class="form-group text-center">
                        <button type="button"
                                class="btn btn-primary form-control"
                                onclick="send_data()">
                            Predict Price
                        </button>
                    </div>

                </form>

                <br>

                <!-- Prediction Result -->
                <div class="text-center">
                    <h4><span id="prediction"></span></h4>
                </div>

            </div>
        </div>
    </div>
</div>

<script>

    // Populate car models dynamically
    function load_car_models() {
        var selectedCompany = document.getElementById("company").value;
        var modelDropdown = document.getElementById("car_models");

        modelDropdown.innerHTML = "";

        car_models.forEach(function(model) {
            if (model.includes(selectedCompany)) {
                var option = document.createElement("option");
                option.value = model;
                option.text = model;
                modelDropdown.add(option);
            }
        });
    }

    // Send AJAX request
    function send_data() {

        var form = document.getElementById("predictionForm");
        var formData = new FormData(form);

        var xhr = new XMLHttpRequest();
        xhr.open("POST", "/predict", true);

        document.getElementById("prediction").innerHTML =
            "Wait! Predicting Price...";

        xhr.onreadystatechange = function () {
            if (xhr.readyState === XMLHttpRequest.DONE) {
                document.getElementById("prediction").innerHTML =
                    "Prediction: ₹ " + xhr.responseText;
            }
        };

        xhr.send(formData);
    }

    // Load models on first page load
    window.onload = load_car_models;

</script>

</body>
</html>
